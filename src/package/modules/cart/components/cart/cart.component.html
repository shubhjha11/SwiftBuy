<div class="container-fluid">
  <div class="row p-4">
    <div class="col-md-9 border-end">
      <div class="row p-4 align-items-center border-bottom">
        <div class="col-md-3">
          <img class="img-fluid" src="https://m.media-amazon.com/images/I/71AEwEupFuL._AC_AA360_.jpg">
        </div>
        <div class="col-md-9">
          <h1 class="mb-2">Lymio Men T-Shirt || T-Shirt for Men || Plain T Shirt || T-Shirt (Rib) (M, Pista)</h1>
          <h4 class="text-muted mb-2">Lymio</h4>
          <span class="text-decoration-line-through me-2">₹1,299</span> 
          <strong class="me-2">₹849</strong>
          <strong class="text-success">34% Off</strong> 
          <div class="d-flex my-2 align-items-center">
            <div class="input-group w-25 me-4">
              <div class="input-group-prepend me-2">
                <button class="btn btn-outline-secondary" type="button" id="button-addon1">-</button>
              </div>
              <input type="text" class="form-control text-center rounded" placeholder="" aria-label="Example text with button addon" aria-describedby="button-addon1" value="1">
              <div class="input-group-append ms-2">
                <button class="btn btn-outline-secondary" type="button" id="button-addon1">+</button>
              </div>
            </div>
            <button class="button button--secondary">
              <fa-icon class="me-2" [icon]="['fas', 'trash']"></fa-icon>
              Remove
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <h1>Price Details</h1>
      <hr>
      <div class="d-flex justify-content-between my-2">
        <div>Price (1 item)</div>
        <div>₹1,299</div>
      </div>
      <div class="d-flex justify-content-between my-2">
        <div>Discount</div>
        <div>- ₹450</div>
      </div>
      <div class="d-flex justify-content-between my-2">
        <div>Delivery Charges</div>
        <div><span class="text-decoration-line-through">₹40</span>Free</div>
      </div>
      <hr>
      <div class="d-flex justify-content-between mt-2 mb-4">
        <div>Total Amount</div>
        <div>₹849</div>
      </div>
      <button class="button button--primary w-100">
        <fa-icon class="me-2" [icon]="['fas', 'shopping-bag']"></fa-icon>
        Buy now
      </button>
    </div>
  </div>
</div>
