<div class="container-fluid">
  <div class="row p-4">
    <div class="col-md-9 border-end">
      <app-cart-items></app-cart-items>
    </div>
    <div class="col-md-3">
      <h1>Price Details</h1>
      <hr>
      <div class="d-flex justify-content-between my-2">
        <div>Price (1 item)</div>
        <div>₹1,299</div>
      </div>
      <div class="d-flex justify-content-between my-2">
        <div>Discount</div>
        <div>- ₹450</div>
      </div>
      <div class="d-flex justify-content-between my-2">
        <div>Delivery Charges</div>
        <div><span class="text-decoration-line-through">₹40</span>Free</div>
      </div>
      <hr>
      <div class="d-flex justify-content-between mt-2 mb-4">
        <div>Total Amount</div>
        <div>₹849</div>
      </div>
      <button class="button button--primary w-100">
        <fa-icon class="me-2" [icon]="['fas', 'shopping-bag']"></fa-icon>
        Buy now
      </button>
    </div>
  </div>
</div>
