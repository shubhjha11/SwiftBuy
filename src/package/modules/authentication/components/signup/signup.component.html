<div class="container-xxl">
  <nav class="navbar justify-content-center">
    <div class="logo-lg" routerLink="/">
        <img src="./../../../../assets/images/swiftbuy1.png" class="img-fluid"/>
    </div>
  </nav>
  <div class="login-page">
    <div class="login-header">
      <h2>Create an Account</h2>
    </div>
    <div class="login-form signup-form">
      <form class="row" [formGroup]="signUpForm">
        <div class="col-md-6">
          <mat-form-field appearance="fill">
            <input matInput
                input="text"
                placeholder="First Name" 
                name="firstName" 
                formControlName="firstName" 
                required>
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field appearance="fill">
            <input matInput
                input="text"
                placeholder="Last Name" 
                name="lastName" 
                formControlName="lastName" 
                required>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field appearance="fill">
            <input matInput
                input="email"
                placeholder="Email" 
                name="password" 
                formControlName="email" 
                required>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field appearance="fill">
            <input matInput 
                type="password" 
                placeholder="Password" 
                name="password" 
                formControlName="password" 
                required>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field appearance="fill">
            <input matInput 
                type="password" 
                placeholder="Confirm Password" 
                name="confirmPassword" 
                formControlName="confirmPassword" 
                required>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <p class="text-small text-start mb-3">
            By clicking Register, you agree that you have read and accepted our User Agreement, User Privacy Notice, Rules and Policies.
          </p>
        </div>
        <button 
            mat-button 
            mat-raised-button 
            class="w-100 sb-button" 
            [disabled]="signUpForm.invalid">
            Register
          </button>
      </form>
    </div>
    <div class="login-footer">
      Already have an account?<a class="link" routerLink="/login"> Sign in </a>
    </div>
  </div>
</div>
