<div class="container-fluid">
  <nav class="navbar">
    <div class="left-navigation">
      <div class="logo" routerLink="/">
        <fa-icon [icon]="['fas', 'store']"></fa-icon>
        <span class="swift-color">swift</span>buy
      </div>
    </div>
  </nav>
  <div class="login-page">
    <div class="login-header">
      <h2>Create an Account</h2>
    </div>
    <div class="login-form signup-form">
      <form class="row" [formGroup]="signUpForm">
        <div class="col-md-6">
          <mat-form-field appearance="fill">
            <input matInput
                input="text"
                placeholder="First Name" 
                name="firstName" 
                formControlName="firstName" 
                required>
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field appearance="fill">
            <input matInput
                input="text"
                placeholder="Last Name" 
                name="lastName" 
                formControlName="lastName" 
                required>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field appearance="fill">
            <input matInput
                input="email"
                placeholder="Email" 
                name="password" 
                formControlName="email" 
                required>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field appearance="fill">
            <input matInput 
                [type]="hide ? 'password' : 'text'"
                placeholder="Password" 
                name="password" 
                formControlName="password" 
                required>
              <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                <mat-icon>
                  <fa-icon *ngIf="hide" [icon]="['fas', 'eye']"></fa-icon>
                  <fa-icon *ngIf="!hide" [icon]="['fas', 'eye-slash']"></fa-icon>
                </mat-icon>
              </button>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field appearance="fill">
            <input matInput 
                [type]="hideConfirm ? 'password' : 'text'"
                placeholder="Confirm Password" 
                name="confirmPassword" 
                formControlName="confirmPassword" 
                required>
              <button mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                <mat-icon>
                  <fa-icon *ngIf="hideConfirm" [icon]="['fas', 'eye']"></fa-icon>
                  <fa-icon *ngIf="!hideConfirm" [icon]="['fas', 'eye-slash']"></fa-icon>
                </mat-icon>
              </button>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <p class="text-small text-start mb-3">
            By clicking Register, you agree that you have read and accepted our User Agreement, User Privacy Notice, Rules and Policies.
          </p>
        </div>
        <button 
            mat-button 
            mat-raised-button 
            class="w-100 button button--primary" 
            [disabled]="signUpForm.invalid">
            Register
          </button>
      </form>
    </div>
    <div class="login-footer">
      Already have an account?<a class="link" routerLink="/login"> Sign in </a>
    </div>
  </div>
</div>
