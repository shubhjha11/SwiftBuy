<h3 class="mb-3">Shop by Category</h3>
<mat-selection-list #shoes multiple="false" >
  <mat-list-option (click)="onCategorySelect(subCategory)"
      *ngFor="let subCategory of subCategories"
      [selected]="subCategory.id == selectedCategory?.id">
    {{subCategory.name}}
  </mat-list-option>
</mat-selection-list>
