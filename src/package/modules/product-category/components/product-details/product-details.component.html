<div class="container-fluid">
  <div class="row p-3">
    <div class="col-md-1">
      <div class="product-image-container thin-scrollbar">
        <div class="product-images" *ngFor="let image of product.imageUrls"
          [ngClass]="{active: image == selectedImage}"
          (mouseover)="selectImage(image)">
          <img class="img-fluid image-contain" src="{{ image }}">
        </div>
      </div>
    </div>
    <div class="col-md-5">
      <img class="img-fluid image-contain" src="{{ selectedImage }}">      
    </div>
    <div class="col-md-6">
      <h3 class="text-muted mb-3">{{ product.brand }}</h3>
      <h1>{{ product.title }}</h1>
      <hr>
      <div class="mb-3 d-flex align-items-end">
        <strong class="display-6 fw-bolder me-2">{{ product.price | currency : 'INR' : 'symbol' : '1.2-2' }}</strong>
        <span class="text-decoration-line-through h2 me-2">{{ product.mrp | currency : 'INR' : 'symbol' : '1.2-2' }}</span>
        <span class="text-success h2 fw-bold">({{ product.discount }}% off)</span> 
      </div>
      <div class="row g-2">       
        <div class="col-md-6">
          <button class="button button--primary w-100">
            <fa-icon class="me-2" [icon]="['fas', 'shopping-cart']"></fa-icon>
            Add to cart
          </button>
        </div>
        <div class="col-md-6">
          <button class="button button--primary w-100">
            <fa-icon class="me-2" [icon]="['fas', 'shopping-bag']"></fa-icon>
            Buy now
          </button>
        </div>
        <div class="col-md-6">
          <button class="button button--tertiary w-100">
            <fa-icon class="me-2" [icon]="['fas', 'shopping-cart']"></fa-icon>
            Go to cart
          </button>
        </div>
        <div class="col-md-6">
          <button class="button button--secondary w-100">
            <fa-icon [icon]="['fas', 'heart']"></fa-icon>
            Add to wishlist
          </button>          
        </div>
      </div>
      <hr>
      <div class="accordion" id="accordionDescription">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button open" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
              Description
            </button>
          </h2>
          <div id="collapseOne" class="accordion-collapse open" data-bs-parent="#accordionDescription">
            <div class="accordion-body">
              <p class="mb-2"><strong>Description</strong></p>
              <p class="mb-2">{{ product.description }}</p>
              <p class="mb-2"><strong>Color</strong></p>
              <p>{{ product.color }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
