<div class="container-fluid">
  <div class="row p-5 align-items-center">
    <div class="col-md-6">
      <img class="img-fluid" src="https://rukminim2.flixcart.com/image/832/832/xif0q/shoe/q/g/e/10-delta-20clgrey-10-asian-light-grey-original-imags37fmu9zyhqf.jpeg?q=70">      
    </div>
    <div class="col-md-6">
      <h3 class="text-muted mb-4">{{ product.brand }}</h3>
      <h1>{{ product.name }}</h1>
      <hr>
      <strong class="display-6 mb-3">{{ product.price | currency : 'INR' : 'symbol' : '1.2-2' }}</strong>
      <p class="mb-2">{{ product.description }}</p>  
      <div class="row g-2">       
        <div class="col-md-6">
          <button class="button button--primary w-100">
            <fa-icon class="me-2" [icon]="['fas', 'shopping-cart']"></fa-icon>
            Add to cart
          </button>
        </div>
        <div class="col-md-6">
          <button class="button button--primary w-100">
            <fa-icon class="me-2" [icon]="['fas', 'shopping-bag']"></fa-icon>
            Buy now
          </button>
        </div>
        <div class="col-md-6">
          <button class="button button--tertiary w-100">
            <fa-icon class="me-2" [icon]="['fas', 'shopping-cart']"></fa-icon>
            Go to cart
          </button>
        </div>
        <div class="col-md-6">
          <button class="button button--secondary w-100">
            <fa-icon [icon]="['fas', 'heart']"></fa-icon>
            Add to wishlist
          </button>          
        </div>
      </div>
    </div>
  </div>
</div>
