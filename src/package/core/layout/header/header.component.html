<nav class="navbar">
    <div class="logo" routerLink="/">
        <fa-icon [icon]="['fas', 'store']"></fa-icon>
        <span class="swift-color">swift</span>buy
    </div>
    <ul class="nav-links">

        <!-- Search -->
        <div class="search-container">
            <input class="search-input" id="searchright" type="search" placeholder="Search...">
        </div>
        <li class="search-icon">
            <label for="searchright">
                <fa-icon [icon]="['fas', 'search']" title="Search"></fa-icon>
            </label>
        </li>
        <li class="search-icon-mobile">
            <label for="searchright" data-bs-toggle="collapse" data-bs-target="#searchCollapse">
                <fa-icon [icon]="['fas', 'search']" title="Search"></fa-icon>
            </label>
        </li>
        
        <!-- Haburger for small device -->
        <label for="hamburger-toggle" class="hamburger" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight"
            aria-controls="offcanvasRight">
            <fa-icon [icon]="['fas', 'bars']"></fa-icon>
        </label>

        <!-- Menu items -->
        <div class="menu">
            <li class="menu-item" routerLink="wishlist" title="Wishlist">
                <fa-icon [icon]="['fas', 'heart']" ></fa-icon>
            </li>
            <li class="menu-item" routerLink="login" title="Login" *ngIf="!isLogin">
                <fa-icon [icon]="['fas', 'user']"></fa-icon>
            </li>
            <li class="menu-item" title="Profile" routerLink="profile" *ngIf="isLogin">
                <fa-icon [icon]="['fas', 'user-circle']" [matMenuTriggerFor]="profileMenu"></fa-icon>
            </li>
            <li class="menu-item" routerLink="cart" title="Cart">
                <fa-icon [icon]="['fas', 'shopping-cart']"></fa-icon>
            </li>
        </div>
    </ul>
</nav>

<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
    <div class="offcanvas-header">
        <h2 class="offcanvas-title" id="offcanvasRightLabel"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="sidepanel-menu">
            <li class="sidepanel-menu-item">
                <a routerLink="/" data-bs-dismiss="offcanvas">
                    <fa-icon [icon]="['fas', 'home']"></fa-icon>
                    <h1>Home</h1>
                </a>
            </li>
            <li class="sidepanel-menu-item" *ngIf="isLogin">
                <a routerLink="login" data-bs-dismiss="offcanvas">
                    <fa-icon [icon]="['fas', 'user-circle']" routerLink="profile"></fa-icon>
                    <h1>My Profile</h1>
                </a>
            </li>
            <li class="sidepanel-menu-item" *ngIf="isLogin">
                <a routerLink="login" data-bs-dismiss="offcanvas">
                    <fa-icon [icon]="['fab', 'shopify']" routerLink="order"></fa-icon>
                    <h1>My Orders</h1>
                </a>
            </li>
            <li class="sidepanel-menu-item">
                <a routerLink="wishlist" data-bs-dismiss="offcanvas">
                    <fa-icon [icon]="['fas', 'heart']"></fa-icon>
                    <h1>Wishlist</h1>
                </a>
            </li>
            <li class="sidepanel-menu-item" *ngIf="!isLogin">
                <a routerLink="login" data-bs-dismiss="offcanvas">
                    <fa-icon [icon]="['fas', 'user']" routerLink="login"></fa-icon>
                    <h1>Login</h1>
                </a>
            </li>
            <li class="sidepanel-menu-item">
                <a routerLink="cart" data-bs-dismiss="offcanvas">
                    <fa-icon [icon]="['fas', 'shopping-cart']"></fa-icon>
                    <h1>Cart</h1>
                </a>
            </li>
            <li class="sidepanel-menu-item" *ngIf="isLogin">
                <a routerLink="/" data-bs-dismiss="offcanvas">
                    <fa-icon [icon]="['fas', 'sign-out-alt']"></fa-icon>
                    <h1>Logout</h1>
                </a>
            </li>
        </ul>
    </div>
</div>

<mat-menu #profileMenu="matMenu" xPosition="before">
    <button mat-menu-item>
        <fa-icon class="me-3" [icon]="['fas', 'user']"></fa-icon>
        My Profile
    </button>
    <button mat-menu-item>
        <fa-icon class="me-3" [icon]="['fab', 'shopify']"></fa-icon>
        My Orders
    </button>
    <button mat-menu-item>
        <fa-icon class="me-3" [icon]="['fas', 'sign-out-alt']"></fa-icon>
        Logout
    </button>
</mat-menu>

<div class="collapse" id="searchCollapse">
    <div class="card card-body my-2 pb-0">
        <mat-form-field appearance="fill" class="mb-0">
            <mat-label>Search..</mat-label>
            <input matInput type="text">
            <button mat-icon-button matSuffix>
              <mat-icon>
                <fa-icon [icon]="['fas', 'search']"></fa-icon>
              </mat-icon>
            </button>
        </mat-form-field>
    </div>
</div>
